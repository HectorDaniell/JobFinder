services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobfinder-db
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: jobfinder
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=vector"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobfinder -d jobfinder']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobfinder-net

  redis:
    image: redis:7-alpine
    container_name: jobfinder-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobfinder-net

